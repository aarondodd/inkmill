name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Plugin index is current and versions are bumped
        shell: bash
        run: |
          git fetch --depth=1 origin main 2>/dev/null || true
          git show origin/main:plugins/index.json > base-index.json 2>/dev/null || : > base-index.json
          python scripts/build_plugin_index.py --check --base base-index.json
      - name: CLI smoke test
        run: |
          python -m inkmill --version
          python -m inkmill --list-styles
          python -m inkmill --plugins
          python -m inkmill --export README.md -o readme.html
